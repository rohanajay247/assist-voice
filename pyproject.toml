[project]
name = "assist-voice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "langchain-litellm>=0.11.1",
    "langchain-mcp-adapters>=0.3.2",
    "langfuse>=5.0.4",
    "langgraph>=1.2.17",
    "litellm>=1.101,<1.106",
    "mcp[cli]>=1.30.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "tzdata>=2026.5",
    "tzlocal>=5.4.5",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "edge-tts>=7.3.1",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.8.1",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so `uv run pytest` finds the backend package
